services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dealmind
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    ports:
      - "8888:8888"
      - "9999:9999"  # Hindsight UI
    environment:
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_API_LLM_PROVIDER:-groq}
      HINDSIGHT_API_LLM_API_KEY: ${LLM_API_KEY:-${GROQ_API_KEY:-}}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_API_LLM_MODEL:-openai/gpt-oss-20b}
      HINDSIGHT_API_LLM_GROQ_SERVICE_TIER: "on_demand"
    volumes:
      - hindsight_data:/home/hindsight/.pg0
    # Backend mock fallback handles graceful degradation if hindsight not running

volumes:
  pgdata:
  hindsight_data:
